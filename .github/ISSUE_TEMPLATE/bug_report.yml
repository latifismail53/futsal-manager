name: Laporan bug
description: Laporkan sesuatu yang tidak berjalan semestinya
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Apa yang terjadi?
      description: Jelaskan bug-nya. Sertakan tangkapan layar bila ada.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      placeholder: |
        1. Buka menu ...
        2. Klik ...
        3. Muncul error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Yang diharapkan
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Lingkungan
      placeholder: "Peran pengguna, browser/perangkat, versi PHP & MySQL"
